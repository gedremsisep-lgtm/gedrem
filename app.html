<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GEDREM Mobile</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0052A2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="gedrem-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="gedrem-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="gedrem-32.png">
<style>
html,body{margin:0;height:100%;background:#0052A2;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;color:#fff;padding:24px;text-align:center}
.sp{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ld small{font-size:13px;opacity:.9;max-width:80%;line-height:1.5}
</style>
</head>
<body>
<div id="ld"><div class="sp"></div><small id="msg">Carregando o GEDREM Mobile…</small></div>
<script>
(function(){
  "use strict";
  var SUP="https://bmmakxofvzyjatscwfex.supabase.co/storage/v1/object/public/gedrem-docs/sistema/app-build.html";
  var CN="gedrem-app-shell";
  /* Remove qualquer service worker antigo (cache-first) que prendia a versao velha */
  try{ if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){}); } }catch(e){}
  function paint(h){ document.open(); document.write(h); document.close(); }
  function ok(h){ return !!h && h.length>200000 && h.indexOf("APP_VERSION")>=0; }
  function save(h){ try{ if(window.caches) caches.open(CN).then(function(c){ c.put("build", new Response(h,{headers:{"Content-Type":"text/html; charset=utf-8"}})); }); }catch(e){} }
  function cached(){ if(!window.caches) return Promise.resolve(null); return caches.open(CN).then(function(c){return c.match("build");}).then(function(r){return r?r.text():null;}).catch(function(){return null;}); }
  function msg(t){ var e=document.getElementById("msg"); if(e) e.textContent=t; }
  fetch(SUP+"?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():null;}).catch(function(){return null;})
  .then(function(h){
    if(ok(h)){ save(h); paint(h); return; }
    cached().then(function(c){
      if(ok(c)){ paint(c); }
      else { msg("Sem conexão e sem versão salva. Conecte-se à internet e recarregue (puxe a tela para baixo)."); }
    });
  });
})();
</script>
</body>
</html>
